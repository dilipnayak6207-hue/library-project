<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Valentine Proposal</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;overflow:hidden;font-family:Poppins,sans-serif}
body{display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#ffd6e7,#ff7aa2)}
#hearts,#confetti{position:fixed;inset:0;pointer-events:none}
.card{text-align:center;color:#fff;padding:20px;z-index:2}
h1{font-family:"Dancing Script",cursive;font-size:3rem;margin:.2em}
.bear{font-size:70px;animation:b 1.2s infinite alternate}
@keyframes b{to{transform:translateY(-15px)}}
.subtitle{font-style:italic}
.buttons{display:flex;justify-content:center;gap:40px;margin-top:30px}
#yes{padding:16px 40px;border:none;border-radius:999px;background:linear-gradient(#ff4b5c,#d6002f);color:#fff;font-size:22px;cursor:pointer}
#yes:hover{box-shadow:0 0 20px #fff}
#no{padding:10px 24px;border:2px solid #d6002f;background:#fff;color:#d6002f;border-radius:999px;cursor:pointer}
.heart{position:fixed;bottom:-30px;animation:float linear forwards}
@keyframes float{0%{transform:translateY(0);opacity:0}10%{opacity:1}100%{transform:translateY(-110vh);opacity:0}}
#celebrate{display:none;position:fixed;inset:0;background:rgba(255,105,180,.95);color:#fff;align-items:center;justify-content:center;flex-direction:column;text-align:center}
#celebrate h2{font-size:4rem;animation:p 1s infinite}
@keyframes p{50%{transform:scale(1.15)}}
.spin{font-size:80px;animation:s 2s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
.conf{position:fixed;width:8px;height:12px;animation:fall 3s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}
</style>
</head>
<body>
<div id="hearts"></div>
<div class="card" id="card">
<div class="bear">🐼</div>
<h1>Will You Be My best enemy 🤔, My 🤔?</h1>
<div class="subtitle">moti moti sabse badi moti ...</div>
<p>Every friendship story is beautiful, but you are my dushman.</p>
<div class="buttons">
<button id="yes">❤️ Yes</button>
<button id="no">No</button>
</div>
</div>
<div id="celebrate">
<h2>Yayyyy!!</h2>
<div class="spin">🥰</div>
<p>I knew you'd say yes 😂 ! ❤️</p>
</div>
<div id="confetti"></div>
<script>
const hearts=document.getElementById('hearts');
let running=true;
function makeHeart(){
 if(!running)return;
 let h=document.createElement('div');
 h.className='heart';
 h.textContent='💖';
 let s=16+Math.random()*24,d=4+Math.random()*5;
 h.style.left=Math.random()*100+'vw';
 h.style.fontSize=s+'px';
 h.style.animationDuration=d+'s';
 hearts.appendChild(h);
 setTimeout(()=>h.remove(),d*1000);
}
for(let i=0;i<15;i++)setInterval(makeHeart,500+i*150);

const msgs=["Nope, not an option!","Try again!","You sure about that?","Not happening!","Think again!"];
let idx=0;
const no=document.getElementById('no');
function moveNo(){
 const y=document.getElementById('yes').getBoundingClientRect();
 let x,t;
 do{
   x=Math.random()*(innerWidth-120);
   t=Math.random()*(innerHeight-60);
 }while(x<y.right+40&&x+120>y.left-40&&t<y.bottom+40&&t+50>y.top-40);
 no.style.position='fixed';no.style.left=x+'px';no.style.top=t+'px';
 no.textContent=msgs[idx++%msgs.length];
}
no.onclick=moveNo;no.ontouchstart=e=>{e.preventDefault();moveNo();};

document.getElementById('yes').onclick=()=>{
 running=false; hearts.innerHTML='';
 document.getElementById('card').style.display='none';
 let c=document.getElementById('confetti');
 for(let i=0;i<120;i++){
  let d=document.createElement('div');
  d.className='conf';
  d.style.left=Math.random()*100+'vw';
  d.style.top='-20px';
  d.style.background=`hsl(${Math.random()*360},100%,50%)`;
  d.style.animationDelay=(Math.random()*1.5)+'s';
  c.appendChild(d);
 }
 document.getElementById('celebrate').style.display='flex';
};
</script>
</body></html>
